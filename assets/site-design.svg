<title id="title">02 / THREE-SITE NETWORK DESIGN</title><desc id="desc">Headquarters and two branches are joined by conceptual routed WAN links. Headquarters has separate operations, finance, IT and guest segments. The drawing is a design reference, not a simulator capture.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52626a" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="495" fill="#f5f3ed"/>
<path d="M40 86 H1080" stroke="#c7d0cd"/>
<text x="40" y="40" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">02 / THREE-SITE NETWORK DESIGN</text>
<text x="40" y="69" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#182b35" text-anchor="start">One headquarters. Two branches. Explicit boundaries.</text><path d="M300 205 H400" fill="none" stroke="#52626a" stroke-width="2"/><path d="M720 205 H820" fill="none" stroke="#52626a" stroke-width="2"/><text x="348" y="188" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#52626a" text-anchor="middle">WAN</text><text x="770" y="188" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#52626a" text-anchor="middle">WAN</text><rect x="40" y="150" width="260" height="112" rx="8" fill="white" stroke="#c7d0cd"/><text x="60" y="184" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">BRANCH B</text><text x="60" y="217" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182b35" text-anchor="start">User network</text><text x="60" y="242" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52626a" text-anchor="start">Routed site connection</text><rect x="400" y="135" width="320" height="135" rx="8" fill="white" stroke="#285d87"/><text x="425" y="174" font-family="Consolas, monospace" font-size="17" font-weight="600" fill="#285d87" text-anchor="start">HEADQUARTERS</text><text x="425" y="209" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182b35" text-anchor="start">Site routing + L3 gateways</text><text x="425" y="243" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">OSPF design baseline</text><rect x="820" y="150" width="260" height="112" rx="8" fill="white" stroke="#c7d0cd"/><text x="840" y="184" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">BRANCH C</text><text x="840" y="217" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182b35" text-anchor="start">User network</text><text x="840" y="242" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52626a" text-anchor="start">Routed site connection</text><path d="M560 270 V309 M160 309 H960 M160 309 V340 M425 309 V340 M690 309 V340 M960 309 V340" fill="none" stroke="#52626a" stroke-width="2"/><rect x="40" y="340" width="245" height="83" rx="8" fill="white" stroke="#c7d0cd"/><text x="60" y="371" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">OPERATIONS</text><text x="60" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Department VLAN</text><rect x="305" y="340" width="245" height="83" rx="8" fill="white" stroke="#c7d0cd"/><text x="325" y="371" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">FINANCE</text><text x="325" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Department VLAN</text><rect x="570" y="340" width="245" height="83" rx="8" fill="white" stroke="#c7d0cd"/><text x="590" y="371" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">IT</text><text x="590" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Department VLAN</text><rect x="835" y="340" width="245" height="83" rx="8" fill="white" stroke="#c7d0cd"/><text x="855" y="371" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#285d87" text-anchor="start">GUEST</text><text x="855" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#52626a" text-anchor="start">Separate access segment</text><text x="40" y="466" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52626a" text-anchor="start">Conceptual reference. Connectivity, isolation and failover still require simulator evidence.</text>
